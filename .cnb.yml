# .cnb.yml — MOS-CMD-CIBUILD-01 WP-C3'''
# CNB社区版云原生构建 · 沐宸MOS Dify web镜像流水线
# 触发=main分支web/变更+手动dispatch双通道
# Runner: 4核8GB（Dify web Dockerfile NODE_OPTIONS=4GB heap，2C4G堆顶偏紧）
# 产出=docker buildx构建web镜像 → 推TCR mcmos命名空间
# 凭据用CNB Secrets注入（TCR永久令牌），不硬编码

main:
  push:
    - paths:
        - 'web/**'
        - '.cnb.yml'
        - 'pnpm-lock.yaml'
        - 'package.json'

workflow_dispatch:

runner:
  cpus: 4
  memory: 8Gi

stages:
  - name: Checkout
    steps:
      - checkout

  - name: Docker Build & Push
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR (腾讯云容器镜像服务)
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          echo "image=ccr.ccs.tencentyun.com/mcmos/dify-web" >> "$CNB_OUTPUT_FILE"
          echo "tag_latest=ccr.ccs.tencentyun.com/mcmos/dify-web:cloud" >> "$CNB_OUTPUT_FILE"
          echo "tag_sha=ccr.ccs.tencentyun.com/mcmos/dify-web:${{ cnb.sha }}" >> "$CNB_OUTPUT_FILE"

      - name: Build and push dify-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ccr.ccs.tencentyun.com/mcmos/dify-web:cloud
            ccr.ccs.tencentyun.com/mcmos/dify-web:${{ cnb.sha }}
          build-args: |
            COMMIT_SHA=${{ cnb.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
