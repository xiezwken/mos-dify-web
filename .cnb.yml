# .cnb.yml — MOS-CMD-CIBUILD-01 WP-C3''' (R4修DSL)
# CNB社区版云原生构建 · 沐宸MOS Dify web镜像流水线
# 语法依据 https://cloud.tencent.com/document/product/1785/116273 + docs.cnb.cool
# 触发=main分支push事件；Runner=4核8GB（Dify web NODE_OPTIONS=4GB heap）
# 产出=docker buildx web/Dockerfile → 推TCR mcmos命名空间
# 凭据用CNB仓库Secrets注入，不硬编码

main:
  push:
    - name: build-push-web
      runner:
        cpus: 4
        memory: 8Gi
      stages:
        - name: Login TCR
          script: |
            docker login ccr.ccs.tencentyun.com \
              -u "${{ secrets.TCR_USERNAME }}" \
              -p "${{ secrets.TCR_PASSWORD }}"

        - name: Build & Push dify-web
          script: |
            # 初始化 buildx builder（CNB runner可能默认只有默认builder，显式建跨架构）
            docker buildx create --name mos-builder --use 2>/dev/null || true
            echo "COMMIT_SHA=${{ cnb.sha }}"

            # 多阶段构建 + 直推 TCR
            docker buildx build \
              --platform linux/amd64 \
              --file web/Dockerfile \
              --build-arg COMMIT_SHA=${{ cnb.sha }} \
              --tag ccr.ccs.tencentyun.com/mcmos/dify-web:cloud \
              --tag ccr.ccs.tencentyun.com/mcmos/dify-web:${{ cnb.sha }} \
              --push \
              .

            echo "=== Push OK ==="
            docker images | head -5
