name: build-web-v7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Docker build (web/Dockerfile, context=repo root)
        run: |
          docker build \
            --progress=plain \
            -f web/Dockerfile \
            -t dify-web:1.16.1-mos-ui-v7 \
            -t ghcr.io/${{ github.repository_owner }}/dify-web:1.16.1-mos-ui-v7 \
            .

      - name: Export image to gzipped tar
        run: |
          docker save dify-web:1.16.1-mos-ui-v7 | gzip > dify-web-v7.tar.gz
          ls -lh dify-web-v7.tar.gz

      - name: Upload tar artifact (retain 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: dify-web-v7-tar
          path: dify-web-v7.tar.gz
          retention-days: 7

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/dify-web:1.16.1-mos-ui-v7
