name: Build dify-web → GHCR (沐宸MOS CIBUILD-01 / v25)

# WP-C3 · 施工席·沐言 · 2026-10-13
# 用途：GitHub Actions 免费 runner 构建 Dify web 前端镜像，推 GHCR 私有仓
# 触发：手动 + web/ 目录 push
# 镜像：ghcr.io/<owner>/dify-web:latest + ghcr.io/<owner>/dify-web:<sha>

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mos-ui-v19
      - mos-ui-v20
      - mos-ui-v21
      - mos-ui-v22
      - mos-ui-v23
      - mos-ui-v24
      - mos-ui-v25
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: buildx + push GHCR
    runs-on: ubuntu-latest  # 4核16GB Actions免费runner
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dify-web
          tags: |
            type=raw,value=1.16.1-mos-ui-v25
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
